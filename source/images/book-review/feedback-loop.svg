<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">经典反馈控制回路</text>

  <!-- Sum block (comparator) -->
  <circle cx="100" cy="130" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="100" y="125" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">±</text>
  <text x="100" y="142" text-anchor="middle" font-size="9" fill="#888">比较器</text>

  <!-- Reference input -->
  <text x="55" y="100" text-anchor="middle" font-size="12" fill="#555">设定值</text>
  <line x1="55" y1="108" x2="76" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Error signal -->
  <line x1="124" y1="130" x2="170" y2="130" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="147" y="120" text-anchor="middle" font-size="10" fill="#e74c3c">偏差 e(t)</text>

  <!-- Controller -->
  <rect x="175" y="103" width="110" height="54" rx="10" fill="#f0f4ff" stroke="#4a7dbe" stroke-width="2"/>
  <text x="230" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">控制器</text>
  <text x="230" y="145" text-anchor="middle" font-size="11" fill="#2c5282">PID / 逻辑运算</text>

  <!-- Controller output -->
  <line x1="285" y1="130" x2="320" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="120" text-anchor="middle" font-size="10" fill="#555">u(t)</text>

  <!-- Actuator -->
  <rect x="325" y="103" width="90" height="54" rx="10" fill="#fff8f0" stroke="#e67e22" stroke-width="2"/>
  <text x="370" y="124" text-anchor="middle" font-size="13" fill="#a0522d">执行器</text>
  <text x="370" y="145" text-anchor="middle" font-size="10" fill="#a0522d">阀门 / 电机</text>

  <!-- Actuator to Plant -->
  <line x1="415" y1="130" x2="450" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Plant -->
  <rect x="455" y="103" width="110" height="54" rx="10" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="510" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">被控对象</text>
  <text x="510" y="145" text-anchor="middle" font-size="10" fill="#555">反应釜 / 电机</text>

  <!-- Plant output -->
  <line x1="565" y1="130" x2="610" y2="130" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="148" text-anchor="middle" font-size="10" fill="#27ae60">输出 y(t)</text>

  <!-- Output label -->
  <text x="630" y="134" text-anchor="middle" font-size="12" fill="#333">被控变量</text>

  <!-- Disturbance arrow -->
  <text x="510" y="80" text-anchor="middle" font-size="10" fill="#e67e22">扰动 D</text>
  <line x1="510" y1="85" x2="510" y2="101" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feedback path -->
  <path d="M510,157 L510,200 L100,200 L100,154" stroke="#27ae60" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Sensor box -->
  <rect x="435" y="190" width="110" height="22" rx="6" fill="#e8f8e8" stroke="#27ae60" stroke-width="1.2"/>
  <text x="490" y="206" text-anchor="middle" font-size="10" fill="#27ae60">传感器 / 变送器</text>

  <!-- Feedback label -->
  <text x="115" y="198" text-anchor="middle" font-size="10" fill="#27ae60">测量值</text>

  <!-- Bottom annotation -->
  <text x="350" y="232" text-anchor="middle" font-size="11" fill="#888" font-style="italic">核心思想：持续比较"实际输出"与"期望输出"，用偏差驱动修正</text>
</svg>
