<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">前馈 + 反馈复合控制系统（锅炉汽包水位控制）</text>

  <!-- ====== Feedforward path (top) ====== -->
  <!-- Disturbance: steam load -->
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#e67e22" font-weight="bold">蒸汽负荷变化（主扰动）</text>

  <!-- Feedforward sensor -->
  <rect x="255" y="72" width="100" height="28" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="305" y="91" text-anchor="middle" font-size="10" fill="#e67e22">前馈测量变送器</text>

  <!-- Feedforward controller -->
  <rect x="395" y="72" width="100" height="28" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="445" y="91" text-anchor="middle" font-size="10" fill="#e67e22">前馈控制器</text>

  <!-- Arrows -->
  <line x1="355" y1="86" x2="393" y2="86" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== Feedback path (bottom) ====== -->
  <!-- SP -->
  <text x="70" y="150" text-anchor="middle" font-size="11" fill="#555">水位设定值</text>

  <!-- Sum1 -->
  <circle cx="130" cy="185" r="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="130" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">±</text>

  <!-- SP → Sum1 -->
  <line x1="70" y1="158" x2="110" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sum1 → PID -->
  <line x1="150" y1="185" x2="185" y2="185" stroke="#4a7dbe" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="168" y="175" text-anchor="middle" font-size="9" fill="#4a7dbe">偏差</text>

  <!-- PID Controller -->
  <rect x="190" y="158" width="105" height="54" rx="10" fill="#f0f4ff" stroke="#4a7dbe" stroke-width="2"/>
  <text x="242" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">PID 控制器</text>
  <text x="242" y="198" text-anchor="middle" font-size="10" fill="#2c5282">反馈控制器</text>

  <!-- Sum2 (combine FF and FB) -->
  <circle cx="365" cy="185" r="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="365" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">+</text>

  <!-- PID → Sum2 -->
  <line x1="295" y1="185" x2="343" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FF → Sum2 -->
  <path d="M445,100 L445,140 L385,140 L385,175" stroke="#e67e22" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Sum2 → Actuator -->
  <line x1="385" y1="185" x2="420" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Actuator (valve) -->
  <rect x="425" y="158" width="85" height="54" rx="10" fill="#fff8f0" stroke="#e67e22" stroke-width="2"/>
  <text x="467" y="180" text-anchor="middle" font-size="12" fill="#a0522d">给水调节阀</text>
  <text x="467" y="198" text-anchor="middle" font-size="10" fill="#a0522d">执行器</text>

  <!-- Actuator → Plant -->
  <line x1="510" y1="185" x2="545" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Plant (Boiler) -->
  <rect x="550" y="145" width="115" height="80" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="607" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">锅炉汽包</text>
  <text x="607" y="193" text-anchor="middle" font-size="10" fill="#555">被控对象</text>
  <text x="607" y="210" text-anchor="middle" font-size="9" fill="#888">水位 = 被控变量</text>

  <!-- Disturbance → Plant -->
  <line x1="280" y1="100" x2="280" y2="160" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="280" y1="160" x2="550" y2="160" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <line x1="665" y1="185" x2="700" y2="185" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feedback path -->
  <path d="M607,225 L607,275 L130,275 L130,205" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Sensor in feedback -->
  <rect x="540" y="264" width="110" height="22" rx="6" fill="#e8f8e8" stroke="#27ae60" stroke-width="1.2"/>
  <text x="595" y="280" text-anchor="middle" font-size="10" fill="#27ae60">水位传感器 / 变送器</text>

  <!-- Labels -->
  <rect x="15" y="140" width="100" height="22" rx="5" fill="#f0f4ff"/>
  <text x="65" y="155" text-anchor="middle" font-size="10" fill="#2c5282" font-weight="bold">反馈回路</text>

  <rect x="540" y="60" width="100" height="22" rx="5" fill="#fff3e0"/>
  <text x="590" y="75" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">前馈回路</text>

  <!-- Annotations -->
  <text x="500" y="305" text-anchor="middle" font-size="10" fill="#888">扰动在前馈通道被测量后直接补偿，不等它影响输出</text>
  <text x="500" y="320" text-anchor="middle" font-size="10" fill="#888">反馈作为"兜底"：万一前馈补偿不完全，由反馈回路修正残余误差</text>
</svg>
