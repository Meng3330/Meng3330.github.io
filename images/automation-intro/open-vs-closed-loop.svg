<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <text x="375" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">开环控制 vs 闭环控制</text>

  <!-- ====== Left: Open Loop ====== -->
  <text x="180" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">开环控制（无反馈）</text>

  <!-- Controller -->
  <rect x="30" y="70" width="110" height="42" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="85" y="96" text-anchor="middle" font-size="12" fill="#c0392b">控制器</text>

  <!-- Actuator -->
  <rect x="170" y="70" width="110" height="42" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="225" y="96" text-anchor="middle" font-size="12" fill="#c0392b">执行器</text>

  <!-- Plant -->
  <rect x="310" y="70" width="110" height="42" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="365" y="96" text-anchor="middle" font-size="12" fill="#c0392b">被控对象</text>

  <!-- Arrows -->
  <line x1="140" y1="91" x2="168" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="91" x2="308" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Input -->
  <text x="42" y="60" text-anchor="middle" font-size="10" fill="#888">输入</text>
  <line x1="20" y1="91" x2="28" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <line x1="420" y1="91" x2="440" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="95" font-size="10" fill="#888">输出</text>

  <!-- Disturbance -->
  <text x="365" y="55" text-anchor="middle" font-size="9" fill="#e67e22">扰动</text>
  <line x1="365" y1="58" x2="365" y2="68" stroke="#e67e22" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Characteristic box -->
  <rect x="80" y="135" width="270" height="55" rx="6" fill="#fff5f5" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="215" y="155" text-anchor="middle" font-size="11" fill="#c0392b">按预设程序运行，不管结果</text>
  <text x="215" y="173" text-anchor="middle" font-size="11" fill="#c0392b">出现扰动 → 输出偏离 → 无修正</text>
  <text x="215" y="186" text-anchor="middle" font-size="10" fill="#888">例：定时洗衣机、交通红绿灯（固定配时）</text>

  <!-- ====== Divider ====== -->
  <line x1="375" y1="205" x2="375" y2="330" stroke="#ddd" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ====== Right: Closed Loop ====== -->
  <text x="560" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">闭环控制（有反馈）</text>

  <!-- Summing junction -->
  <circle cx="420" cy="91" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="420" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">±</text>

  <!-- Input -->
  <text x="395" y="60" text-anchor="middle" font-size="10" fill="#888">设定值</text>
  <line x1="398" y1="68" x2="406" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Controller -->
  <rect x="455" y="70" width="100" height="42" rx="8" fill="#e8f8e8" stroke="#27ae60" stroke-width="2"/>
  <text x="505" y="96" text-anchor="middle" font-size="12" fill="#1e7e34">控制器</text>

  <!-- Actuator -->
  <rect x="580" y="70" width="100" height="42" rx="8" fill="#e8f8e8" stroke="#27ae60" stroke-width="2"/>
  <text x="630" y="96" text-anchor="middle" font-size="12" fill="#1e7e34">执行器 + 对象</text>

  <!-- Arrows -->
  <line x1="436" y1="91" x2="453" y2="91" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="82" text-anchor="middle" font-size="9" fill="#e74c3c">偏差</text>
  <line x1="555" y1="91" x2="578" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <line x1="680" y1="91" x2="700" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="718" y="95" font-size="10" fill="#888">输出</text>

  <!-- Feedback path -->
  <path d="M630,112 L630,150 L420,150 L420,107" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Sensor on feedback -->
  <rect x="510" y="142" width="80" height="18" rx="5" fill="#d4edda" stroke="#27ae60" stroke-width="1"/>
  <text x="550" y="156" text-anchor="middle" font-size="10" fill="#1e7e34">传感器</text>

  <!-- Disturbance -->
  <text x="645" y="55" text-anchor="middle" font-size="9" fill="#e67e22">扰动</text>
  <line x1="645" y1="58" x2="645" y2="68" stroke="#e67e22" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Characteristic box -->
  <rect x="455" y="178" width="270" height="55" rx="6" fill="#f0fff0" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="590" y="198" text-anchor="middle" font-size="11" fill="#1e7e34">持续测量输出，比较偏差，自动修正</text>
  <text x="590" y="216" text-anchor="middle" font-size="11" fill="#1e7e34">出现扰动 → 反馈检测到偏差 → 自动补偿</text>
  <text x="590" y="230" text-anchor="middle" font-size="10" fill="#888">例：空调恒温、自动驾驶、自动巡航</text>

  <!-- Bottom comparison -->
  <rect x="130" y="295" width="500" height="45" rx="8" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="380" y="313" text-anchor="middle" font-size="12" fill="#555">核心区别：有没有把"实际输出"拉回来和"期望输出"比较</text>
  <text x="380" y="330" text-anchor="middle" font-size="11" fill="#888">有反馈 = 闭环（能自动纠错）  ·  没反馈 = 开环（一条道走到黑）</text>
</svg>
